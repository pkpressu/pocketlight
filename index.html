<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141516"><meta name="description" content="PocketLight: private photo editing on your device."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>PocketLight • Local photo studio</title></head><body>
<header><div><strong>◈ PocketLight</strong><small>YOUR DEVICE. YOUR DARKROOM.</small></div><div class="actions"><button id="library">Library</button><button id="save">Save</button><button id="export" class="accent">Export ↗</button></div></header>
<main><section class="workspace"><div class="toolbar"><label class="button accent">＋ Import photo<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><button id="demo">Demo</button><button id="undo" aria-label="Undo">↶</button><button id="redo" aria-label="Redo">↷</button><button id="compare" aria-pressed="false">Original</button><button id="fit">Fit</button></div><div id="stage"><canvas id="photo" aria-label="Photo preview"></canvas><div id="empty">Drop a photo here<br><small>JPEG · PNG · WebP — processed locally</small></div></div><footer><span id="filename">Demo scene</span><span id="status" role="status">Ready</span></footer></section>
<aside><canvas id="histogram" width="256" height="70" aria-label="Luminance histogram"></canvas><nav aria-label="Editing tools"><button data-tab="light" class="active">Light</button><button data-tab="color">Color</button><button data-tab="effects">Effects</button><button data-tab="crop">Crop</button><button data-tab="presets">Looks</button></nav><div id="controls"></div><div class="bottom"><button id="reset">Reset edits</button><button id="privacy">Privacy & offline</button></div></aside></main>
<dialog id="dialog"><div id="modal"></div><button id="close">Close</button></dialog><script type="module" src="app.js"></script></body></html>
